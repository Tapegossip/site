name: Add to library

# Open an issue (e.g. from the GitHub phone app) to add an item:
#   title: the link, or a book title
#   body (optional lines): category: ... / tags: a, b / note: ... / type: article
# Only the repository owner's issues are processed; anyone else's are ignored.
on:
  issues:
    types: [opened]

jobs:
  add:
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      added: ${{ steps.commit.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt

      - id: add
        env:
          # Passed via env, never interpolated into the script, so issue text can't inject commands.
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          RESULT_FILE: ${{ runner.temp }}/result.md
        run: |
          python scripts/library.py from-issue 2>&1 | tee "${{ runner.temp }}/log.txt"

      - name: Commit
        id: commit
        if: steps.add.outcome == 'success'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/library
          git commit -m "Add to library: ${ISSUE_TITLE:0:72}"
          git push

      - name: Report and close
        if: steps.add.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '\n\nDeploying now; it will be live in about a minute.\n' >> "${{ runner.temp }}/result.md"
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file "${{ runner.temp }}/result.md"
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Couldn't add this:"; echo '```'; tail -n 15 "${{ runner.temp }}/log.txt" 2>/dev/null; echo '```'; } > "${{ runner.temp }}/error.md"
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file "${{ runner.temp }}/error.md"

  deploy:
    needs: add
    if: needs.add.outputs.added == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
